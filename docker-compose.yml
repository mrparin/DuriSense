name: durisense

services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"
    networks: [app_net]
    security_opt: ["no-new-privileges:true"]

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durisense}
      POSTGRES_USER: ${POSTGRES_USER:-durisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - durisense_db:/var/lib/postgresql/data
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  mosquitto:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
    networks: [app_net, iot_net]
    security_opt: ["no-new-privileges:true"]

  api:
    build: ./backend
    environment:
      DURISENSE_ENVIRONMENT: ${DURISENSE_ENVIRONMENT:-development}
      DURISENSE_DATABASE_URL: ${DURISENSE_DATABASE_URL:-postgresql+asyncpg://durisense:change-me@db:5432/durisense}
      DURISENSE_ALLOWED_ORIGINS: ${DURISENSE_ALLOWED_ORIGINS:-["http://127.0.0.1:3000","http://localhost:3000","http://127.0.0.1:4173","http://localhost:4173"]}
      DURISENSE_ALLOWED_HOSTS: ${DURISENSE_ALLOWED_HOSTS:-["127.0.0.1","localhost","api"]}
      DURISENSE_COOKIE_SECURE: ${DURISENSE_COOKIE_SECURE:-false}
      DURISENSE_EXPOSE_DEV_TOKENS: ${DURISENSE_EXPOSE_DEV_TOKENS:-true}
      DURISENSE_SECRET_KEY: ${DURISENSE_SECRET_KEY:-development-only-secret-change-before-production}
      DURISENSE_ADMIN_EMAIL: ${DURISENSE_ADMIN_EMAIL:-}
      DURISENSE_ADMIN_PASSWORD: ${DURISENSE_ADMIN_PASSWORD:-}
      DURISENSE_ADMIN_MFA_SECRET: ${DURISENSE_ADMIN_MFA_SECRET:-}
      DURISENSE_PUBLIC_APP_URL: ${DURISENSE_PUBLIC_APP_URL:-http://127.0.0.1:4173}
      DURISENSE_SMTP_HOST: ${DURISENSE_SMTP_HOST:-mailpit}
      DURISENSE_SMTP_PORT: ${DURISENSE_SMTP_PORT:-1025}
      DURISENSE_SMTP_USERNAME: ${DURISENSE_SMTP_USERNAME:-}
      DURISENSE_SMTP_PASSWORD: ${DURISENSE_SMTP_PASSWORD:-}
      DURISENSE_SMTP_FROM_EMAIL: ${DURISENSE_SMTP_FROM_EMAIL:-noreply@durisense.local}
      DURISENSE_SMTP_STARTTLS: ${DURISENSE_SMTP_STARTTLS:-false}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    networks: [app_net, data_net, iot_net]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  mqtt-ingestor:
    build:
      context: .
      dockerfile: services/mqtt-ingestor/Dockerfile
    environment:
      DURISENSE_DATABASE_URL: postgresql+asyncpg://durisense:change-me@db:5432/durisense
      DURISENSE_MQTT_HOST: mosquitto
      DURISENSE_MQTT_PORT: 1883
    volumes:
      - ./backend/app:/app/app
      - ./packages:/app/packages
      - ./services/mqtt-ingestor/main.py:/app/main.py
    networks: [data_net, iot_net]
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      DURISENSE_DATABASE_URL: postgresql+asyncpg://durisense:change-me@db:5432/durisense
      DURISENSE_MQTT_HOST: mosquitto
      DURISENSE_MQTT_PORT: 1883
      DURISENSE_SIMULATOR_INTERVAL: 10
    volumes:
      - ./backend/app:/app/app
      - ./packages:/app/packages
      - ./services/simulator/main.py:/app/main.py
    networks: [data_net, iot_net]
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_TEST: "true"
    command: ["pytest", "-q"]
    environment:
      DURISENSE_ENVIRONMENT: test
      DURISENSE_DATABASE_URL: sqlite+aiosqlite:////tmp/test.db
      DURISENSE_SECRET_KEY: test-secret-key-at-least-32-characters
      DURISENSE_COOKIE_SECURE: "false"
      DURISENSE_EXPOSE_DEV_TOKENS: "true"
      PYTHONPATH: "/app:/app/packages"
    volumes:
      - ./backend:/app
      - ./packages:/app/packages
    networks: [app_net]

networks:
  app_net:
  data_net:
    internal: true
  iot_net:

volumes:
  durisense_db:
  mosquitto_data:
