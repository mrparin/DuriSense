[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "durisense-api"
version = "0.1.0"
description = "DuriSense identity and tenant-isolated API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==45.0.6",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "pyotp==2.9.0",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
